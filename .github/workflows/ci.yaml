name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [".", "jetstream"]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"

      - name: gofmt
        run: |
          unformatted=$(gofmt -l -d . 2>&1) || true
          if [ -n "$unformatted" ]; then
            echo "::error::File(s) not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The store targets 32-bit TamaGo boards; 386 catches int overflows.
      - name: go vet (darwin, 32-bit)
        run: |
          GOOS=darwin GOARCH=arm64 go vet ./...
          GOOS=linux GOARCH=386 go vet ./...

      - name: go fix
        run: |
          diff=$(go fix -diff ./... 2>&1) || true
          if [ -n "$diff" ]; then
            echo "$diff"
            echo "::error::Files need go fix. Run: go fix ./..."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [".", "jetstream"]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"

      - name: Test (race + shuffle)
        run: go test -race -shuffle=on -count=1 -timeout=10m ./...

      - name: Test (32-bit)
        run: GOARCH=386 go test -count=1 -timeout=10m ./...
